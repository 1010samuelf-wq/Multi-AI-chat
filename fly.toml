# Fly.io config. `fly launch --copy-config --no-deploy` lets you pick the app name and region.
app = "multi-ai-factcheck"
primary_region = "yyz"

[build]

[env]
  DATA_DIR = "/data"

[mounts]
  source = "debate_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running so debates continue after you close the page.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
