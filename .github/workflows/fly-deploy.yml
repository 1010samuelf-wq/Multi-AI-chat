# Deploys the app to Fly.io. Start it from the Actions tab ("Run workflow").
# On the first run it creates the Fly app and its storage volume.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN      a Fly org token that can create apps (fly tokens create org)
#   APP_PASSWORD       the password for the website
# Optional: ANTHROPIC_API_KEY. Otherwise add the key on the website's Settings page.
name: Deploy to Fly.io

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Fly app name (becomes <name>.fly.dev)"
        default: "multi-ai-factcheck"
        required: true
      org:
        description: "Fly organization slug"
        default: "personal"
        required: true
      region:
        description: "Fly region (yyz = Toronto, iad = Virginia, lhr = London…). Must match the volume's region."
        default: "yyz"
        required: true

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ inputs.app_name }}
      ORG: ${{ inputs.org }}
      REGION: ${{ inputs.region }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are set
        env:
          HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_PW: ${{ secrets.APP_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_FLY" = "true" ] || missing="$missing FLY_API_TOKEN"
          [ "$HAS_PW" = "true" ] || missing="$missing APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if it doesn't exist
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "App $APP already exists."
          else
            flyctl apps create "$APP" --org "$ORG"
          fi

      - name: Create the storage volume if it doesn't exist
        run: |
          count=$(flyctl volumes list --app "$APP" --json | jq '[.[] | select(.name == "debate_data")] | length')
          if [ "$count" = "0" ]; then
            flyctl volumes create debate_data --app "$APP" --region "$REGION" --size 1 --yes
          else
            echo "Volume already exists."
          fi

      - name: Set app secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          flyctl secrets set --stage --app "$APP" APP_PASSWORD="$APP_PASSWORD"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            flyctl secrets set --stage --app "$APP" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          fi

      - name: Deploy
        run: flyctl deploy --remote-only --app "$APP" --primary-region "$REGION" --ha=false

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/healthz"; then
              echo
              echo "Live at https://$APP.fly.dev"
              exit 0
            fi
            sleep 6
          done
          echo "::error::The app did not answer its health check"
          flyctl logs --app "$APP" --no-tail | tail -50
          exit 1

      - name: Check the password gate is on
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP.fly.dev/")
          echo "Home page without password: HTTP $code (expected 401)"
          [ "$code" = "401" ]
